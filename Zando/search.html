<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | ZANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-900">

  <!-- NAVBAR -->
  <header class="border-b border-gray-200 sticky top-0 bg-white z-50">
    <div class="max-w-screen-2xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-7 text-sm font-medium">
        <a href="index.html" class="font-semibold border-b-2 border-black pb-1">WOMEN</a>
        <a href="#" class="hover:text-black text-gray-700">MEN</a>
        <a href="#" class="text-pink-500 font-semibold">BEAUTY</a>
        <a href="#" class="hover:text-black text-gray-700">KIDS</a>
        <a href="#" class="hover:text-black text-gray-700">LIFESTYLE</a>
      </div>
      <a href="index.html" class="text-2xl font-extrabold tracking-tight">ZANDO.</a>
      <div class="flex items-center gap-5">
        <span class="text-lg">🇰🇭</span>
        <a href="search.html" class="hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </a>
        <button class="hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
        <button class="hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
        <button class="hover:text-gray-600 relative">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- SEARCH SECTION -->
  <main class="max-w-screen-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl md:text-3xl font-bold mb-6">Search</h1>

    <!-- Search Input -->
    <div class="relative max-w-2xl mb-10">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input 
        id="search-input" 
        type="text" 
        placeholder="Search for products, brands..." 
        class="w-full border border-gray-300 rounded-full py-3.5 pl-12 pr-4 text-sm outline-none focus:border-black focus:ring-1 focus:ring-black"
        autofocus
      >
    </div>

    <!-- Results count -->
    <p id="results-count" class="text-sm text-gray-500 mb-6"></p>

    <!-- Results Grid -->
    <div id="search-results" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
      <!-- Filled by JS -->
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-20">
      <p class="text-gray-400 text-lg">No products found</p>
      <p class="text-gray-400 text-sm mt-2">Try a different keyword</p>
    </div>
  </main>

  <script>
    let allProducts = [];

    // Load products
    fetch('product.json')
      .then(res => res.json())
      .then(products => {
        allProducts = products;
        // Check URL for search query
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q') || '';
        document.getElementById('search-input').value = q;
        if (q) {
          searchProducts(q);
        } else {
          renderProducts(allProducts);
          document.getElementById('results-count').textContent = `${allProducts.length} products`;
        }
      })
      .catch(err => console.error(err));

    // Search on input
    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.trim();
      // Update URL without reload
      const url = new URL(window.location);
      if (query) url.searchParams.set('q', query);
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', url);

      searchProducts(query);
    });

    function searchProducts(query) {
      if (!query) {
        renderProducts(allProducts);
        document.getElementById('results-count').textContent = `${allProducts.length} products`;
        document.getElementById('empty-state').classList.add('hidden');
        return;
      }

      const q = query.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.name.toLowerCase().includes(q) ||
        p.brand.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        document.getElementById('search-results').innerHTML = '';
        document.getElementById('results-count').textContent = '0 products';
        document.getElementById('empty-state').classList.remove('hidden');
      } else {
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('results-count').textContent = `${filtered.length} product${filtered.length > 1 ? 's' : ''} found`;
        renderProducts(filtered);
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('search-results');
      container.innerHTML = products.map(p => `
        <a href="product_detail.html?id=${p.id}" class="block text-[#111] no-underline group">
          <div class="relative w-full aspect-[3/4] overflow-hidden bg-[#f5f5f5] rounded mb-3">
            <img src="${p.images[0]}" alt="${p.name}" 
                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.04]">
            ${p.discount ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-semibold py-0.5 px-1.5 rounded">-${p.discount}%</span>` : ''}
          </div>
          <div class="text-xs font-semibold tracking-wide text-[#666] mb-1 uppercase">${p.brand}</div>
          <div class="text-sm font-medium mb-2 leading-snug text-[#111] line-clamp-2">${p.name}</div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[15px] font-bold text-[#111]">$${p.price.toFixed(2)}</span>
            ${p.discount ? `
              <span class="text-xs font-semibold text-[#e11d48] bg-[#fef2f2] py-0.5 px-1.5 rounded">-${p.discount}%</span>
              <span class="text-[13px] text-[#999] line-through">$${p.originalPrice.toFixed(2)}</span>
            ` : ''}
          </div>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
