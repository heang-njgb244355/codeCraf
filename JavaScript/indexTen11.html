<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEN•ELEVEN Navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* ===== LEFT: Burger ===== */
    .nav-left {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .burger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .burger span {
      display: block;
      width: 22px;
      height: 2px;
      background: #111;
      border-radius: 2px;
      transition: 0.3s;
    }

    .burger:hover span {
      background: #555;
    }

    /* ===== CENTER: Logo ===== */
    .nav-center {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #111;
      text-decoration: none;
      text-transform: uppercase;
    }

    .logo span {
      font-weight: 400;
      margin: 0 2px;
    }

    /* ===== RIGHT: Icons ===== */
    .nav-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-btn:hover {
      color: #555;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Notification badge */
    .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #e11d48;
      color: white;
      font-size: 10px;
      font-weight: 600;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile: keep same layout */
    @media (max-width: 640px) {
      .navbar {
        padding: 14px 16px;
      }

      .logo {
        font-size: 18px;
      }

      .nav-right {
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <!-- Left: Burger -->
    <div class="nav-left">
      <button class="burger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Center: Logo -->
    <div class="nav-center">
      <a href="/" class="logo">TEN<span>•</span>ELEVEN</a>
    </div>

    <!-- Right: Search + Notification -->
    <div class="nav-right">
      <!-- Search -->
      <button class="icon-btn" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </button>

      <!-- Notification -->
      <button class="icon-btn" aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span class="badge">3</span>
      </button>
    </div>
  </nav>

</body>
</html>
